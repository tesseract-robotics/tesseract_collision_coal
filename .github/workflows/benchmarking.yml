name: Benchmarking

on:
  push:
    branches:
      - master

  # allow manually starting this workflow
  workflow_dispatch:

# Supersede in-progress pull-request runs; queue everything else so two runs on one ref never race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tesseract-robotics/tesseract:jammy-master
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Etc/UTC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: target_ws/src

      - name: Install Depends
        shell: bash
        run: |
          apt update
          apt upgrade -y
          apt install -y liboctomap-dev

      - name: Build
        uses: tesseract-robotics/colcon-action@v15
        with:
          before-script: source /opt/tesseract/install/setup.bash
          ccache-prefix: benchmarks
          vcs-file: dependencies.repos
          upstream-args: --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_INTERFACE=OFF
          target-path: target_ws/src
          target-args: --cmake-args -DCMAKE_BUILD_TYPE=Release -DTESSERACT_ENABLE_TESTING=OFF -DTESSERACT_ENABLE_BENCHMARKING=ON -DTESSERACT_ENABLE_RUN_BENCHMARKING=OFF -DBENCHMARK_ARGS=CI_ONLY

      - name: Run Benchmarks
        shell: bash
        run: |
          source /opt/tesseract/install/setup.bash
          source $GITHUB_WORKSPACE/upstream_ws/install/setup.bash
          source $GITHUB_WORKSPACE/target_ws/install/setup.bash
          cd $GITHUB_WORKSPACE/target_ws
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release -DTESSERACT_ENABLE_TESTING=OFF -DTESSERACT_ENABLE_BENCHMARKING=ON -DTESSERACT_ENABLE_RUN_BENCHMARKING=ON -DBENCHMARK_ARGS=CI_ONLY
          ./src/.run_combine_benchmark_results

      # Disabled: benchmark-data-dir-path is tesseract's own chart directory in tesseract_docs,
      # so publishing from this repository would overwrite tesseract's performance history.
      # Re-enable once this repository has a directory of its own.
      - name: Store Bullet Discrete, FCL Discrete and Environment benchmark result
        if: false
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: C++ Benchmark
          tool: 'googlecpp'
          output-file-path: target_ws/benchmarks/tesseract-benchmark_result.json
          benchmark-data-dir-path: tesseract/dev/bench
          gh-repository: github.com/tesseract-robotics/tesseract_docs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@Levi-Armstrong'
          max-items-in-chart: 20

      # Disabled with the step above; it publishes what that step stages.
      - name: Push benchmark result
        if: false
        uses: cpina/github-action-push-to-another-repository@v1.7
        env:
          SSH_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        with:
          source-directory: benchmark-data-repository/tesseract/dev/bench
          destination-github-username: tesseract-robotics
          destination-repository-name: tesseract_docs
          target-branch: gh-pages
          target-directory: tesseract/dev/bench
